name: CI - Ant Build & Checks

on:
  push:
    branches: [ master, development, task/1-public-release-with-full-docs-and-ci-6f2rxxV33qHWH33c ]
  pull_request:
    branches: [ master, development ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Java installation
        run: java -version

      - name: Copy Maven dependencies
        run: mvn -B dependency:copy-dependencies -DoutputDirectory=lib

      - name: Build with Ant
        run: ant compile

      - name: Cache Ant dependencies
        uses: actions/cache@v5
        with:
          path: ~/.ant
          key: ${{ runner.os }}-ant-${{ hashFiles('**/build.xml') }}
          restore-keys: |
            ${{ runner.os }}-ant-

      - name: Build project
        run: ant -noinput -buildfile build.xml clean jar

      - name: Run unit tests
        run: ant test

      - name: Run Checkstyle (if defined)
        run: |
          if ant -p | grep -q checkstyle; then
            ant checkstyle
          else
            echo "No 'checkstyle' target defined, skipping."
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: e-gov-artifacts
          path: |
            dist/
            build/
            **/*.jar
