name: CI - Ant Build & Checks

on:
  push:
    branches: [ master, development, task/publish-v3-0-0-after-pmd-integration-6g2gx4g3XR9wGCCc ]
  pull_request:
    branches: [ master, development ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify Java installation
        run: java -version

      # -----------------------------
      # Maven Dependencies
      # -----------------------------
      - name: Copy Maven dependencies
        run: mvn -B dependency:copy-dependencies -DoutputDirectory=lib

      # -----------------------------
      # Ant Build
      # -----------------------------
      - name: Build with Ant
        run: ant compile

      - name: Build project
        run: ant -noinput -buildfile build.xml clean jar

      - name: Run unit tests
        run: ant test

      # -----------------------------
      # PMD Static Analysis
      # -----------------------------
      - name: Run PMD analysis
        run: mvn -B pmd:pmd

      - name: Enforce PMD rules (fail on violations)
        run: mvn -B pmd:check

      # -----------------------------
      # Upload Artifacts
      # -----------------------------
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: e-gov-artifacts
          path: |
            dist/
            build/
            **/*.jar

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pmd-report
          path: |
            target/site/pmd.html
            target/pmd.xml
