name: CodeQL

on:
  push:
    branches: [ "master", "development", "task/align-j-unit-platform-dependencies-after-dependabot-upgrade-6fqcFVFFWcQCxPvc" ]
  pull_request:
    branches: [ "master", "development", "task/align-j-unit-platform-dependencies-after-dependabot-upgrade-6fqcFVFFWcQCxPvc" ]
  schedule:
    - cron: '0 3 * * 1' # Weekly scan

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: java

      - name: Copy Maven dependencies
        run: mvn -B dependency:copy-dependencies -DoutputDirectory=lib

      - name: Build with Ant
        run: |
          ant -noinput -buildfile build.xml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
