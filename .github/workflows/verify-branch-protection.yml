name: Verify Branch Protection Rules

on:
  workflow_dispatch: # allows manual trigger
  # schedule:
    # - cron: "0 6 * * 1" # every Monday at 06:00 UTC

env:
  TARGET_BRANCHES: "master development"
  REQUIRED_STATUS: "Build and Test"
  ISSUE_TITLE: "Branch Protection Policy Violation Detected"

jobs:
  verify-protection:
    name: Verify Branch Protection
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify branch protections
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🔍 Checking branch protection rules..."
          ERRORS=""

          for BRANCH in $TARGET_BRANCHES; do
            echo ""
            echo "=== Checking $BRANCH branch ==="

            PROTECTION=$(gh api repos/${{ github.repository }}/branches/$BRANCH/protection 2>/dev/null || echo "{}")

            if [[ "$PROTECTION" == "{}" ]]; then
              ERRORS+="❌ Branch '$BRANCH' has no protection rules configured.\n"
              continue
            fi

            # Require pull request reviews
            REVIEWS=$(echo "$PROTECTION" | jq -r '.required_pull_request_reviews')
            if [[ -z "$REVIEWS" || "$REVIEWS" == "null" ]]; then
              ERRORS+="❌ Missing pull request review requirement on '$BRANCH'\n"
            fi

            # Require at least one approving review
            APPROVALS=$(echo "$PROTECTION" | jq -r '.required_pull_request_reviews.required_approving_review_count // 0')
            if [[ "$APPROVALS" -lt 1 ]]; then
              ERRORS+="❌ Expected ≥1 approving review for '$BRANCH', got $APPROVALS\n"
            fi

            # Require specific status check
            STATUS=$(echo "$PROTECTION" | jq -r '.required_status_checks.contexts[]?' | grep -F "$REQUIRED_STATUS" || true)
            if [[ -z "$STATUS" ]]; then
              ERRORS+="❌ Required status check '$REQUIRED_STATUS' missing on '$BRANCH'\n"
            fi

            # Disallow force pushes
            FORCE_PUSH=$(echo "$PROTECTION" | jq '.allow_force_pushes.enabled')
            if [[ "$FORCE_PUSH" == "true" ]]; then
              ERRORS+="❌ Force pushes allowed on '$BRANCH'\n"
            fi

            # Disallow deletions
            ALLOW_DELETE=$(echo "$PROTECTION" | jq '.allow_deletions.enabled')
            if [[ "$ALLOW_DELETE" == "true" ]]; then
              ERRORS+="❌ Branch deletions allowed on '$BRANCH'\n"
            fi

            if [[ -z "$ERRORS" ]]; then
              echo "✅ Branch '$BRANCH' meets protection policy."
            fi
          done

          if [[ -n "$ERRORS" ]]; then
            echo -e "🚨 Violations found:\n$ERRORS"
            echo "errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "🎉 All branches comply with protection policy."
          fi

      - name: Create issue if violations found
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🪄 Creating issue for policy violations..."
          BODY="The following branch protection violations were detected:\n\n${{ steps.verify.outputs.errors }}\n\nPlease review repository settings."
          gh issue create \
            --title "${{ env.ISSUE_TITLE }}" \
            --body "$BODY" \
            --label "ci" \
            --label "branch-protection" \
            || echo "⚠️ Issue may already exist."
